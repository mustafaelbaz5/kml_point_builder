[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kml-point-builder"
version = "0.1.0"
description = "Standalone KML/KMZ parcel reference-point builder"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kml-point-builder = "kml_point_builder.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
